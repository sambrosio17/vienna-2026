name: Aggiorna eventi di Vienna
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-events.mjs
      - name: Commit se cambiato
        run: |
          if git diff --quiet -- events.json && git ls-files --error-unmatch events.json >/dev/null 2>&1; then echo "Nessuna novità"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Aggiorna eventi di Vienna"
          git push
